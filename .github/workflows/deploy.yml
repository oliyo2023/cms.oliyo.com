name: Deploy to Cloudflare

# 推送 main 即构建并部署到 Cloudflare Worker（ai-wechat-cms）；也可在 Actions 页面手动触发。
# D1 迁移不在这里自动执行（生产库结构变更需人工确认）：本地跑 `pnpm db:remote`。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署不可并发：同一分支串行，且不取消进行中的部署（避免半完成状态）。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build 自带 TypeScript 类型检查，类型错误会在这里挡住部署。
      - name: Build
        run: pnpm worker:build

      # Worker 名、D1 库 id、R2 桶名都写在 wrangler.jsonc 里（均非密钥），无需额外变量。
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
